<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wrapbox — 2 a.m., the night checkout broke · live demo</title>
    <meta name="description" content="Wrapbox, end to end: one continuous live demo of every feature in the real prototype, with narration." />
    <script>
      // One slide, light by default; ?theme=dark opens dark; ?shot=N freezes for captures.
      try {
        var q = new URLSearchParams(location.search).get("theme");
        if (new URLSearchParams(location.search).has("shot")) document.documentElement.dataset.shot = "1";
        document.documentElement.dataset.theme = q === "dark" ? "dark" : "light"; document.documentElement.dataset.deck = "v2"; // white page, dark controls
      } catch (e) { document.documentElement.dataset.theme = "light"; }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="deck"></div>
    <script type="module" src="/src/portfolio/main-demo.tsx"></script>
  </body>
</html>
