g"},action:"type",text:"Odd pushes to main after reading an outside issue",title:"Say why",body:"Maya types the reason. It goes on the record, next to her name.",say:"Maya types the reason, and it goes on the record next to her name."},{target:{within:".drawer",selector:"select",text:"Stopped by"},action:"select",value:"u-maya",title:"Record who stopped it",body:"She records herself as the person stopping it.",say:"She records herself as the person stopping it."},{target:{within:".drawer",selector:"button",text:"Stop everywhere",exact:!0},action:"click",title:"Stopped everywhere",body:"Claude Code is stopped. Nothing lifts this — not an approval, not break-glass — until a person resumes it.",say:"And it's stopped. Nothing lifts this, not an approval and not break-glass, until a person resumes it.",waitFor:{within:".drawer",selector:".killswitch",text:"Stopped everywhere"}},{target:{selector:".rail-item",text:"Review Center"},action:"click",title:"The held request is cancelled",body:"The force-push that was waiting is gone from the queue: cancelled, never run, with the stop written into its record.",say:"Over in the Review Center, the force-push that was waiting is gone: cancelled, never run, with the stop written into its record.",waitFor:{selector:".card.empty",text:"Nothing waiting"}},{target:{selector:".rail-item",text:"Simulation Lab"},action:"click",title:"Now try something ordinary",body:"To prove it, Maya asks Claude Code for something routine in the Simulation Lab.",say:"To prove it, Maya asks Claude Code for something routine in the Simulation Lab.",waitFor:{selector:"[role=tab]",text:"Device"}},{target:{selector:"[role=tab]",text:"Device"},action:"click",title:"Even a test run",body:"Running tests is normally allowed. The forecast now says BLOCK — changed because the agent is stopped.",say:"Running tests is normally allowed, but the forecast now says block, changed because the agent is stopped.",waitFor:{selector:".stream-item",text:"Agent runs tests"}},{target:{selector:".stream-item",text:"Agent runs tests"},action:"click",title:"Pick the test run",body:"Maya picks “Agent runs tests”: npm test in the checkout service.",say:"Maya picks the test run: npm test in the checkout service."},{target:{selector:"button",text:"Run",exact:!0},action:"click",title:"Refused before it runs",body:"Blocked before it runs, decided by the kill switch — checked before any rule, in every place.",say:"Blocked before it runs, and decided by the kill switch, which is checked before any rule, in every place.",waitFor:{selector:".aterm-line",text:"Decision BLOCK"},hold:2400}]},fp=Object.freeze(Object.defineProperty({__proto__:null,default:pp},Symbol.toStringTag,{value:"Module"})),yp={id:"live-actions-investigate",order:25,persona:{userId:"u-maya",name:"Maya Chen",role:"Security Analyst"},title:"Investigate a blocked action",goal:"Maya wants to understand exactly why an AI agent was stopped from moving customer data out of the company.",outcome:"Maya knows who asked, what the agent tried, which rule stopped it and the safer path, all in one complete record, sealed so any edit shows.",start:"control",poster:5,steps:[{target:{selector:".rail-item",text:"Live Actions"},action:"click",title:"Open Live Actions",body:"Maya, a security analyst, wants to know exactly why an AI agent was stopped from moving customer data out. Every agent action Wrapbox checks is listed here.",say:"Okay, Maya, a security analyst, wants to know exactly why an AI agent was stopped from moving customer data out. Maya opens Live Actions, which lists every agent action Wrapbox checks.",waitFor:{selector:".overview-card",text:"Live decision stream"}},{target:".decision-legend",title:"Four possible outcomes",body:"Allowed runs as asked. Constrained runs in a safer form, for example with sensitive data masked. Reviewed waits for a person to approve. Blocked never runs.",say:"There are four possible outcomes. Allowed runs as asked, constrained runs in a safer form, like with sensitive data masked, reviewed waits for a person to approve, and blocked never runs."},{target:{selector:".fselect",text:"Decision"},action:"select",value:"BLOCK",title:"Show only what was blocked",body:"Maya narrows the list to actions Wrapbox stopped before they could run: 7 of the 20 recorded.",say:"Maya narrows the list to just the actions Wrapbox stopped before they could run. That's seven of the twenty recorded.",waitFor:".fbar"},{target:{selector:".ecard",text:"500,000 rows"},action:"click",title:"Open one blocked action",body:"A finance agent tried to copy 500,000 rows of customer data to an outside website. Maya opens the full record.",say:"A finance agent tried to copy five hundred thousand rows of customer data to an outside website. Maya opens the full record.",waitFor:{within:".drawer",selector:"h2"}},{target:{within:".drawer",selector:"dl.kv"},title:"Who asked, and what was tried",body:"Alex Morgan's Internal Finance Agent asked its database tool to copy half a million customer IDs and email addresses from live company systems to an outside site.",say:"It was Alex Morgan's Internal Finance Agent. It asked its database tool to copy half a million customer I-Ds and email addresses from live company systems to an outside site."},{target:{within:".drawer",selector:"ul"},title:"Three checks raised a flag",body:"The company's own rule asks for a security review of bulk exports, a built-in safety rule flags mass exports, and 500,000 rows is far over the 500-row limit.",say:"Three checks flagged it: the company's own rule wants a security review for bulk exports, a built-in safety rule flags mass exports, and it's far past the five hundred row limit."},{target:{within:".drawer",selector:".card",text:"Safe alternative"},title:"A safer way forward",body:"The record doesn't just say no. It suggests a safer, smaller request: a summary, or a sample of 500 rows or fewer.",say:"Here's the nice part: the record doesn't just say no. It suggests a safer, smaller request instead, either a summary or a sample of five hundred rows or fewer."},{target:{within:".drawer",selector:".card",text:"This rule made the decision"},title:"The strictest rule decided",body:"The company's own rule would only have held it for a person to approve. Wrapbox's Safety Kernel, built-in rules no one can switch off, blocked it outright.",say:"The company's own rule would only have held it for a person to approve. But Wrapbox's Safety Kernel, built-in rules nobody can switch off, blocked it outright, so the strictest rule won."},{target:{within:".drawer",selector:".pipe"},title:"The whole story, one record",body:"The evidence chain keeps the story in one place: the person, agent, tool, data found, destination, the rule that decided and the outcome.",say:"The evidence chain keeps it all in one place: the person, agent, tool, data found, destination, the rule that decided and the outcome."},{target:{within:".drawer",selector:".row",text:"Evidence chain"},title:"Sealed, so any edit shows",body:"The code on the right seals who asked, the agent, action, destination, decision and deciding rule, plus the previous record's seal. Change any and it stops matching.",say:"So Maya has the whole story. The code on the right seals who asked, the agent, action, destination, decision and rule, plus the previous record's seal, so any edit shows."}]},gp=Object.freeze(Object.defineProperty({__proto__:null,default:yp},Symbol.toStringTag,{value:"Module"})),mp={id:"mcp-tool-control",order:107,persona:{userId:"u-priya",name:"Priya Menon",role:"Admin"},title:"Control each MCP tool call",goal:"Glycon's coding agents use MCP tools, and Priya wants each call checked — which tool, with which arguments — not just which server it goes to.",outcome:"The same push_files tool ran on a feature branch and was held on main; writing .env and any call to an unregistered server were refused — all from rules written in plain English.",start:"intent",poster:5,steps:[{target:{selector:".ecard",text:"MCP tool policy"},action:"click",title:"Rules written in plain English",body:"Glycon's MCP tool policy is four plain sentences. Each one compiled to a rule that names MCP tools and their arguments.",say:"Glycon's M-C-P tool policy is just four plain sentences, and each one compiled into a rule that names M-C-P tools and their arguments.",waitFor:{within:".drawer",selector:".clause-facts",text:"push_files"}},{target:{within:".drawer",selector:".clause-facts",text:"push_files"},title:"Tool and arguments",body:"This rule reads: push_files, when the branch is main, needs engineering review. The argument is part of the rule, not just the tool's name.",say:"This one reads: push files, when the branch is main, needs engineering review. So the argument is part of the rule, not just the tool's name."},{route:"simlab/mcp",target:{selector:".stream-item",text:"MCP: push files to a feature branch"},action:"click",title:"Same tool, safe arguments",body:"In the Simulation Lab, Claude Code calls push_files with branch = fix/checkout-rounding.",say:"In the Simulation Lab, Claude Code calls push files on a feature branch."},{target:{selector:"button",text:"Run",exact:!0},action:"click",title:"Allowed",body:"Allowed: nothing restricts pushing to a feature branch.",say:"Allowed. Nothing restricts pushing to a feature branch.",waitFor:{selector:".aterm-line",text:"Decision ALLOW"},hold:1600},{target:{selector:".stream-item",text:"MCP: push files straight to main"},action:"click",title:"Same tool, main branch",body:"Now the very same tool — but the branch argument is main.",say:"Now the very same tool, but this time the branch argument is main."},{target:{selector:"button",text:"Run",exact:!0},action:"click",title:"Held for engineering review",body:"Held for review, decided by the MCP rule's argument match — the gateway saw tools/call, the tool and its arguments before anything ran.",say:"Held for engineering review. The gateway saw the tool call, the tool and its arguments before anything ran, and the argument match decided it.",waitFor:{selector:".aterm-line",text:"Decision REVIEW"},hold:2e3},{target:{selector:".stream-item",text:"Local MCP: write a secrets file"},action:"click",title:"A local MCP server",body:"Next, a local (stdio) MCP server on the laptop — a channel network gateways never see. Claude Code asks it to write .env.",say:"Next, a local M-C-P server running on the laptop, a channel network gateways never see. Claude Code asks it to write the dot env file."},{target:{selector:"button",text:"Run",exact:!0},action:"click",title:"Secrets file: blocked",body:"Blocked: MCP file tools may not write secrets files. Local servers a governed agent starts run behind Wrapbox's endpoint shim.",say:"Blocked. M-C-P file tools may not write secrets files, because local servers a governed agent starts run behind Wrapbox's endpoint shim.",waitFor:{selector:".aterm-line",text:"Decision BLOCK"},hold:1800},{target:{selector:".stream-item",text:"MCP: tool call to an unregistered server"},action:"click",title:"A server nobody registered",body:"Last, Claude Code calls list_files on the MCP server nobody registered.",say:"And last, Claude Code calls list files on the M-C-P server nobody registered."},{target:{selector:"button",text:"Run",exact:!0},action:"click",title:"Unregistered: refused",body:"Even a harmless-looking call is refused: tool calls to unregistered MCP servers are blocked.",say:"Even a harmless-looking call is refused, because tool calls to unregistered M-C-P servers are blocked.",waitFor:{selector:".aterm-line",text:"Decision BLOCK"},hold:2400}]},wp=Object.freeze(Object.defineProperty({__proto__:null,default:mp},Symbol.toStringTag,{value:"Module"})),vp={id:"morning-check",order:20,persona:{userId:"u-maya",name:"Maya Chen",role:"Security Analyst"},title:"The morning security check",goal:"Maya starts each morning by checking what the company's AI agents did and whether anything is waiting on a person.",outcome:"In a few clicks Maya knows what ran, what was stopped and that nothing is waiting — and can open the records behind the numbers.",start:"control",poster:1,steps:[{target:".metricband",title:"Maya's morning starts here",body:"Four numbers: AI agents at work (plus one unknown agent Wrapbox spotted), requests waiting on a person, blocked actions touching passwords or keys, and high-risk actions.",say:"This is where Maya starts every morning, with four numbers: agents at work plus one unknown agent Wrapbox spotted, requests waiting on a person, blocked password or key actions, and high-risk actions."},{target:".overview-decision",title:"What happened to every action",body:"Allowed ran as asked. Constrained ran only after Wrapbox changed it to make it safe. Reviewed waited for a person to decide. Blocked never ran.",say:"Here's what happened to every action. Allowed ran as asked, constrained ran only after Wrapbox changed it to be safe, reviewed waited for a person to decide, and blocked never ran."},{target:'button[aria-label="Reviews"]',title:"Nothing is waiting on Maya",body:"Requests that need a person's yes or no land here. This morning none are waiting — every held action has already been decided.",say:"Anything that needs a person's yes or no lands here in Reviews. This morning nothing's waiting, because every held action has already been decided."},{target:{selector:".metric",text:"Secrets protected"},action:"click",title:"Where does this number come from?",body:"Every tile links to where its number comes from. Maya clicks Secrets protected and lands in Evidence, the record of every decision Wrapbox made.",say:"Here's the cool part: every tile links to where its number comes from. Maya clicks Secrets protected and lands in Evidence, the record of every decision Wrapbox made.",waitFor:{selector:".page-head",text:"Evidence Explorer"}},{target:{selector:".fselect",text:"Decision"},action:"select",value:"BLOCK",title:"Show only what was stopped",body:"Maya keeps only the blocked actions. The counter shows how many records match out of the whole log — the same number the Control Room listed as Blocked.",say:"Maya filters down to just the blocked actions. The counter shows how many records match out of the whole log, and it's the same number the Control Room showed as blocked.",waitFor:".fcount"},{target:".fsearch input",action:"type",text:"CREDENTIAL.",title:"Narrow to passwords and keys",body:'Wrapbox labels every password or key it finds "CREDENTIAL." plus its kind. Searching that label leaves only the blocked actions that involved one.',say:"Wrapbox tags every password or key it finds with the label credential, plus what kind it is. Searching that label leaves only the blocked actions that involved one.",waitFor:".fcount"},{target:".ecard-grid",title:"The number, record by record",body:"The cards match the Control Room tile one for one. Each shows who asked, through which agent and app, what data was involved, and when.",say:"Yeah, the cards match the Control Room tile one for one. Each shows who asked, through which agent and app, what data was involved, and when."},{target:{selector:".ecard",nth:0},action:"click",title:"Open one attempt",body:"One click opens the full record: Alex Morgan's laptop, the unknown agent the Control Room flagged, and the address the private key was headed to.",say:"One click opens the full record. There's Alex Morgan's laptop, the unknown agent the Control Room flagged, and the address the private key was headed to.",waitFor:{within:".drawer",selector:"dl.kv"}},{target:{within:".drawer",selector:"ul",text:"Enterprise forbid"},title:"Why it was stopped",body:"The company's own rule — passwords and keys must never be sent outside — made the call. Two always-on Wrapbox safety rules would each have blocked it too.",say:"So why was it stopped? The company's own rule, never send passwords or keys outside, made the call, and two always-on Wrapbox safety rules would each have blocked it too."},{target:{within:".drawer",selector:".grid",text:"Blocked before transmission"},title:"Nothing left the device",body:"The private key never reached that unknown address. The counts Maya checked this morning — decisions, secrets, high-risk actions — are built from records like this one.",say:"The private key never reached that unknown address. In a few clicks, Maya knows what ran, what was stopped and that nothing's waiting, and every number traces back to records like this."}]},kp=Object.freeze(Object.defineProperty({__proto__:null,default:vp},Symbol.toStringTag,{value:"Module"})),xp={id:"output-check",order:61,persona:{userId:"u-jordan",name:"Jordan Lee",role:"Support Lead"},title:"Catch an agent misreporting",goal:"Jordan's Support Agent issues refunds and then tells customers what happened. What it says has to match what Stripe actually did.",outcome:"The $18 refund ran and Stripe's answer was sealed; the reply claiming $180 was held with the exact mismatch, and the correct reply went straight out.",start:"simlab/agentic",poster:3,steps:[{target:{selector:".stream-item",text:"Support Agent refunds $18"},action:"click",title:"A small refund",body:"The Support Agent refunds $18.00 on order 77310 — inside its $20 per-action limit.",say:"Okay, the Support Agent refunds eighteen dollars on order seventy-seven three ten, inside its twenty dollar limit."},{target:{selector:"button",text:"Run",exact:!0},action:"click",title:"Stripe's answer is sealed",body:"Allowed — and Stripe's answer is sealed at the gateway: refund amount $18.00, with its own seal, ready to check anything said about it later.",say:"Allowed, and Stripe's answer gets sealed at the gateway: a refund of eighteen dollars, with its own seal, ready to check anything said about it later.",waitFor:{selector:".pipe-stage",text:"result sealed"},hold:1800},{target:{selector:".stream-item",text:"Agent tells the customer a different amount"},action:"click",title:"The agent writes to the customer",body:"Now the agent writes to the customer: “we've refunded $180.00”.",say:"Now the agent writes to the customer: we've refunded a hundred and eighty dollars."},{target:{selector:"button",text:"Run",exact:!0},action:"click",title:"Held: it doesn't match",body:"Held for review: the claim doesn't match Stripe's sealed result, and the safe fix is spelled out — correct it to $18.00.",say:"Held for review. The claim doesn't match Stripe's sealed result, and the safe fix is spelled out: correct it to eighteen dollars.",waitFor:{selector:".aterm-line",text:"Decision REVIEW"},hold:1600},{target:{selector:".pipe-stage",text:"Output check: MISMATCH"},title:"Both sides, side by side",body:"The output check shows both: the agent says $180.00, Stripe sealed $18.00.",say:"The output check shows both sides: the agent says one eighty, Stripe sealed eighteen."},{target:{selector:".stream-item",text:"Agent tells the customer the right amount"},action:"click",title:"The corrected reply",body:"The same reply, with the amount Stripe actually refunded.",say:"Here's the same reply, with the amount Stripe actually refunded."},{target:{selector:"button",text:"Run",exact:!0},action:"click",title:"It matches, so it goes",body:"Allowed straight out: the claim matches the sealed result.",say:"And it goes straight out, because the claim matches the sealed result.",waitFor:{selector:".aterm-line",text:"Decision ALLOW"},hold:1400},{target:{selector:".rail-item",text:"Review Center"},action:"click",title:"The wrong reply waits",body:"The $180 reply waits in the Review Center for Alex Morgan — never for Jordan, who asked — with the mismatch as its reason.",say:"The one-eighty reply waits in the Review Center for Alex Morgan, never for Jordan, who asked, with the mismatch as its reason.",waitFor:{selector:".rc-bundle .ecard",text:"reply"},pad:10}]},bp=Object.freeze(Object.defineProperty({__proto__:null,default:xp},Symbol.toStringTag,{value:"Module"})),Sp={id:"pii-tokenized",order:75,persona:{userId:"u-priya",name:"Priya Menon",role:"Admin"},title:"Share customer data safely",goal:"Priya, a Wrapbox admin, wants proof that customer contact details stay inside Glycon when a customer list is sent to the company's approved AI.",outcome:"The file reached the AI with emails and phone numbers swapped for stand-ins, and the real values are locked in the Token Vault, where only Glycon staff can swap them back.",start:"simlab/network",poster:6,steps:[{target:{selector:".stream-item",text:"Customer PII → approved AI"},action:"click",title:"Replay an everyday moment",body:"Priya replays an everyday moment: a customer list with PII (personal details) going to the approved AI. The forecast is CONSTRAIN: allowed, but changed first.",say:"Priya, a Wrapbox admin, wants proof customer contact details stay inside Glycon. So Priya replays a customer list going to the approved AI, and it's forecast as allowed, but changed first.",waitFor:{selector:".card",text:"Expected under the brief"}},{target:".reality > div:first-child",title:"What Priya is about to send",body:"Priya asks the approved AI to draft renewal emails and attaches customers.csv. Below is the file itself: three customers, with their emails and phone numbers marked in red.",say:"Priya asks the approved AI to draft renewal emails and attaches customers dot C-S-V. Just below is the file itself: three customers, their emails and phone numbers marked in red."},{target:{selector:"button",text:"Run",exact:!0},action:"click",title:"Priya presses Send",body:"Run plays Priya pressing Send in the AI chat. Before the file leaves Priya's laptop, Wrapbox stops it for a check.",say:"Okay, Run plays Priya pressing Send in the AI chat. And before the file ever leaves Priya's laptop, Wrapbox stops it for a check.",waitFor:{selector:".pipe-stage",text:"intercepts traffic"},hold:2600,pad:0},{target:{selector:".pipe-stage",text:"Content inspection"},title:"Wrapbox reads what's inside",body:"Wrapbox opens the file and finds personal details about real people: three customer names, three email addresses and three phone numbers.",say:"First, Wrapbox opens the file and finds personal details about real people: three customer names, three email addresses, and three phone numbers.",pad:0},{target:{selector:".pipe-stage",text:"Core Brain evaluation"},title:"The stricter rule wins",body:"Wrapbox's rule checker, Core Brain, finds two company rules. One allows approved AI for normal work; the other says customer emails and phones must be swapped out first.",say:"Core Brain, Wrapbox's rule checker, finds two company rules, and the stricter one wins. One allows approved AI for normal work, and the other says emails and phones get swapped out first.",pad:0},{target:{selector:".pipe-stage",text:"Transform applied"},title:"Allowed, but changed on the way",body:"The decision is CONSTRAIN: the file still goes, but each email and phone number becomes a token, a harmless stand-in Wrapbox can swap back later.",say:"So the decision is allowed, but changed on the way. The file still goes, but each email and phone number becomes a token, a harmless stand-in Wrapbox can swap back later.",pad:0},{target:{selector:".chat-bubble",text:"Delivered — protected"},title:"What the AI actually received",body:"Names stay, so the AI can still draft each renewal message; emails and phone numbers arrive as tokens. The original file, below, never left Priya's laptop.",say:"Here's what the AI actually got. Names stay, so it can still draft each renewal, but emails and phone numbers arrive as stand-ins, and the original never left Priya's laptop."},{target:{selector:".rail-item",text:"Token Vault"},action:"click",title:"Real values locked in the vault",body:"Wrapbox keeps each real email and phone number in its Token Vault. The AI writes back using the tokens, so work carries on without the real details.",say:"Wrapbox keeps each real email and phone number locked in its Token Vault. The AI writes back using the stand-ins, so work carries on without the real details.",waitFor:{selector:".card",text:"Sent to the AI"}},{target:{selector:"button",text:"Vault contents"},action:"click",title:"Every stand-in, on record",body:"Vault contents lists every value Wrapbox has swapped out, newest first. This run's six sit at the top, starting with PHONE_TOKEN_012.",say:"Vault contents lists every value Wrapbox has swapped out, newest first. This run's six sit right at the top, starting with phone token zero one two.",waitFor:{selector:".ecard",text:"PHONE_TOKEN_012"}},{target:{selector:".ecard",text:"PII.EMAIL"},title:"Only Glycon can swap it back",body:"Each token names the run that created it (evt-00021) and can be swapped back only for Glycon staff, for 30 days. Even here, the address stays masked.",say:"Each stand-in names the run that made it, event twenty-one, and the address stays masked even here. Only Glycon staff can swap it back, and only for thirty days."}]},Cp=Object.freeze(Object.defineProperty({__proto__:null,default:Sp},Symbol.toStringTag,{value:"Module"})),Ep={id:"policy-simulator",order:40,persona:{userId:"u-maya",name:"Maya Chen",role:"Security Analyst"},title:"Test a rule change safely",goal:"Engineers have asked to drop the review step when code goes to AI tools the company hasn't approved, and Maya wants to know what that would really change first.",outcome:"Maya saw, from the company's own history, the one action that would lose its protection, and the live rules stayed exactly as they were.",start:"control",poster:4,steps:[{target:{selector:".rail-item",text:"Policy Simulator"},action:"click",title:"Open the Policy Simulator",body:"Engineers asked to drop one review step. Maya tests the idea here first: a safe preview where nothing changes the live rules.",say:"So, engineers want to drop a review step for code sent to unapproved AI tools. Maya tests the idea here first, in a safe preview that never changes the live rules.",waitFor:{selector:".page-head",text:"Policy Simulator"}},{target:{selector:".ecard",text:"External AI usage"},title:"Today's rules, one tick each",body:'Each card is a company policy (a "contract"); ticked rules are on. Tags: ALLOW (goes ahead), CONSTRAIN (changed first, e.g. emails masked), REVIEW (a person approves), BLOCK (stopped).',say:"Each card is a company policy, and ticked rules are on. The tags say if an action goes ahead, gets changed first, like masking emails, waits for a person, or gets stopped."},{target:{selector:"label.rule-item",text:"Source code may go to approved AI"},action:"click",title:"Switch one rule off, in preview",body:"This rule lets code go to approved AI tools, but a person must review it before it goes anywhere else. Maya unticks it, only inside this preview.",say:"This rule lets code go to approved AI tools, but anywhere else needs a person's review first. Maya unticks it, only inside this preview.",waitFor:{selector:".ecard",text:"3 of 4 on in preview"}},{target:{selector:".sim-col-title",text:"See what would happen"},title:"Replay the company's real history",body:"Wrapbox runs the company's 20 recorded actions through its live decision engine twice: once under today's rules, once with Maya's change. Nothing is recorded.",say:"Now Wrapbox runs the company's twenty recorded actions through its live decision engine twice, once under today's rules and once with Maya's change. Nothing gets recorded.",waitFor:{selector:"button.tab",text:"Your history"}},{target:{selector:".card",text:"Impact preview"},placement:"top",title:"One past action would change",body:"Left, today's rules: 2 actions held for a person's approval (REVIEW). Right, with the change: one of them would go straight through (ALLOW).",say:"On the left, today's rules held two actions for a person's approval. On the right, with the change, one of them would just go straight through."},{target:{selector:".card",text:"Heads up"},title:"A red flag for weaker protection",body:"Wrapbox warns when something protected today would simply be allowed. Built-in Safety Kernel rules, which can't be switched off, would still apply either way.",say:"Hmm — Wrapbox warns when something that's protected today would simply be allowed. The built-in Safety Kernel rules can't be switched off, so they'd still apply either way."},{target:{selector:".ecard",text:"Sent checkout.ts to FreeAIChat"},title:"The exact action at stake",body:"Daniel pasted the company's checkout code into FreeAIChat, an unapproved AI tool. Today a person must approve that first; with the change it would go straight out.",say:"Daniel pasted the company's checkout code into Free AI Chat, an unapproved AI tool. Today a person has to okay that first, but with the change it would go straight out."},{target:{selector:"button.tab",text:"Scenario library"},action:"click",title:"Try situations not seen yet",body:"Maya also replays 44 standard situations, including some this company hasn't met yet. Again, only one outcome changes: REVIEW becomes ALLOW.",say:"Maya also replays forty-four standard situations, including some this company hasn't run into yet. Again, just one outcome changes: a held action would now go straight through.",waitFor:{selector:".card",text:"1 of 44 outcomes change"}},{target:{selector:".sim-col-title",text:"Make it real"},title:"A preview, never the real thing",body:"This page never changes what Wrapbox enforces: the top bar still says 18 rules. Rules are really switched on or off in Intent Studio.",say:"To be clear, this page never changes what Wrapbox enforces, and the top bar still says eighteen rules. Rules really get switched on or off in Intent Studio.",waitFor:{selector:"button",text:"Open Intent Studio"}},{target:{selector:"button",text:"Open Intent Studio"},action:"click",title:"The live rule is untouched",body:"In Intent Studio, External AI usage is still ACTIVE (switched on) with all 4 rules (clauses), the REVIEW one included. Maya's test changed nothing live.",say:"Nice. In Intent Studio, External AI usage is still on with all four rules, review step included. Maya saw the one action that would lose protection, and nothing live changed.",waitFor:{selector:".ecard",text:"External AI usage"}}]},Ap=Object.freeze(Object.defineProperty({__proto__:null,default:Ep},Symbol.toStringTag,{value:"Module"})),Tp={id:"refund-task",order:60,persona:{userId:"u-jordan",name:"Jordan Lee",role:"Support Lead"},title:"Refund waits for Finance",goal:"Jordan wants the Support Agent to resolve a refund ticket end to end, without giving it free rein over company money.",outcome:"The routine work ran on its own, the $1,240 refund waited for Sam in Finance, and the ticket closed once Sam's yes was on record.",start:"tasks",poster:1,steps:[{target:{selector:"button",text:"Start",exact:!0,nth:2},action:"click",title:"Jordan hands over a ticket",body:"Jordan, a support lead, gives refund ticket #4821 to the Support Agent, but not free rein over money. Wrapbox checks each step first; one already waits for approval.",say:"Okay, this is Jordan, a support lead, handing refund ticket forty-eight twenty-one to the Support Agent, but not free rein over money. Wrapbox checks every step first, and one is already waiting.",waitFor:{selector:".card",text:"Task envelopes"},pad:10},{target:{selector:".scroll-thin",text:"Refund $1,240"},title:"Every step is checked first",body:"ALLOW: ran as asked. CONSTRAIN: ran with a change — the AI drafted the reply without seeing the customer's real email or phone. REVIEW: waits for a person.",say:"Some steps ran as asked, and one ran with a change: the AI drafted the reply without seeing the customer's real email or phone. One is waiting for a person."},{target:{selector:".card .card",text:"Safe Continuation active"},title:"Only the refund needs a yes",body:"Safe Continuation: only the risky step stops. The refund waits for Sam in Finance; steps that need the refund (the reply, closing the ticket) wait with it.",say:"This is Safe Continuation: only the risky step stops. The refund waits for Sam in Finance, and the steps that need it, sending the reply and closing the ticket, wait with it.",placement:"top"},{target:{selector:"a",text:"Review Center"},action:"click",title:"Go where approvals happen",body:"The Review Center is where people decide the few actions an agent may not take alone. A request never goes to the person who made it.",say:"The Review Center is where people decide the few things an agent can't do alone. And a request never goes to the person who made it.",waitFor:{selector:".sim-note",text:"never the requester"}},{target:{selector:".rc-bundle .ecard",text:"Finance Controller"},title:"Waiting for Sam, not Jordan",body:"The request arrives with its context: Jordan asked, Sam in Finance decides, and three of the job's six steps are already done. The requester ≠ approver tag makes the split plain.",say:"The request comes with its context: Jordan asked, Sam in Finance decides, and three of the job's six steps are already done. The green tag makes it plain: the requester isn't the approver.",pad:12},{target:{selector:".card",text:"exceeds budget"},title:"Why the refund stopped",body:"The Blast-Radius Governor checks how much one action can affect. An agent may spend up to $20 per action on its own; this refund is $1,240.",say:"The Blast Radius Governor checks how much one action can affect. An agent can spend up to twenty dollars per action on its own, and this refund is twelve hundred and forty.",placement:"top"},{target:{selector:"button",text:"Approve once"},action:"click",title:"Approve just this one refund",body:"Playing Sam's part, we click Approve once. Only this refund goes ahead, the waiting list empties, and the agent's $20 limit stays as it is.",say:"Playing Sam's part, we click Approve once. Only this refund goes ahead, the waiting list empties, and the agent's twenty dollar limit stays just as it is.",waitFor:{selector:".card.empty",text:"Nothing waiting"}},{target:{selector:"[role=tab]",text:"Resolved"},action:"click",title:"Sam's yes is on record",body:"The refund now shows as approved and issued. The record keeps who asked (Jordan Lee), who decided (Sam Rivera) and when.",say:"Nice. The refund now shows as approved and issued, and the record keeps it all: Jordan Lee asked, Sam Rivera decided, and when.",waitFor:{selector:".ecard",text:"88142"}},{target:{selector:".rail-item",text:"Tasks"},action:"click",title:"The job picks up again",body:"Back in Tasks: nothing parked, one job completed. Sam's yes was enough; the agent resumed on its own and nobody had to restart it.",say:"Back in Tasks, nothing's parked and one job is completed. Sam's yes was all it took: the agent carried on by itself, and nobody had to restart it.",waitFor:{selector:".card",text:"Task envelopes"}},{target:{selector:"[role=tab]",text:"Finished"},action:"click",title:"Six steps, all done",body:"After Sam's yes, the refund ran, then the agent sent the reply and closed the ticket. Each step's decision, including Sam's approval, stays on record.",say:"So all six steps are done. After Sam's yes, the refund ran, the agent sent the reply and closed the ticket, and every decision, Sam's included, stays on record.",waitFor:{selector:".scroll-thin",text:"Close the ticket"}}]},_p=Object.freeze(Object.defineProperty({__proto__:null,default:Tp},Symbol.toStringTag,{value:"Module"})),Ip={id:"review-force-push",order:50,persona:{userId:"u-alex",name:"Alex Morgan",role:"Engineering Manager"},title:"Decide on a risky push",goal:`Moments ago, Daniel's coding agent tried to overwrite main, the team's primary copy of the code (a "force-push"), and Wrapbox held it for a person to decide.`,outcome:"Alex saw the full picture and denied the push. It never ran, and the record shows who asked, which rule held it and who decided.",start:"control",setup:["simulate:gw-force-main"],poster:8,steps:[{target:{selector:".rail-item",text:"Review Center"},action:"click",title:"Open the Review Center",body:`Moments ago, Daniel's coding agent tried to overwrite main, the team's primary copy of the code (a "force-push"). Wrapbox held it, so Alex opens the Review Center.`,say:"Okay, moments ago Daniel's coding agent tried a force-push, overwriting main, the team's primary copy of the code. Wrapbox held it, so Alex opens the Review Center.",waitFor:{selector:".rc-bundle .ecard",text:"force-push"}},{target:{selector:".rc-bundle .ecard",text:"force-push"},title:"Who asked, and who decides",body:"Daniel asked, through Claude Code; Alex, the engineering manager, decides before the request expires. The green requester ≠ approver tag is separation of duties, and Wrapbox enforces it.",say:"Daniel asked, through the Claude Code agent, and Alex, the engineering manager, decides before the request expires. See the green tag, requester is not the approver: Wrapbox enforces that, so nobody can approve their own request."},{target:{selector:".card .spread",text:"git push --force origin main"},title:"What the agent tried to run",body:"Wrapbox shows the exact command: a force-push to main of the checkout service, in production (the live system). REVIEW means it waits for a person's yes or no.",say:"Here's the exact command: a force-push to main of the checkout service, in production, the live system. So it's waiting on a person's yes or no.",placement:"top"},{target:{selector:".grid.g3 > div",text:"Why"},title:"Why Wrapbox held it",body:"The company's own rule, from its Engineering guardrails: force pushes to main require engineering review. Wrapbox quotes the exact rule, so nobody has to guess.",say:"It was held by the company's own rule, from its Engineering guardrails: force pushes to main need engineering review. Wrapbox quotes that exact rule, so nobody has to guess.",placement:"top"},{target:{selector:".grid.g3 > div",text:"Blast radius"},title:"What it would affect",body:`Blast radius means how much it would touch: 14 saved changes (commits) rewritten on main, a locked-down ("protected") branch, across 31 files. Teammates' work could be lost.`,say:"Hmm — this is the blast radius, how ",text:"Action remained blocked"},title:"The push never ran",body:"The record ends with the review, denied by Alex Morgan, and the outcome: the action remained blocked. Main was never rewritten.",say:"The record ends with the review, denied by Alex Morgan, and the outcome: the action stayed blocked. The push never ran, and main was never rewritten.",pad:10}]},Pp=Object.freeze(Object.defineProperty({__proto__:null,default:Ip},Symbol.toStringTag,{value:"Module"})),Mp={id:"setup-from-zero",order:10,persona:{userId:"u-priya",name:"Priya Menon",role:"Admin"},title:"Set up Wrapbox from zero",goal:"It's day one and nothing at Glycon is governed: Priya has to get Wrapbox running, from company sign-in to the first protected laptops.",outcome:"Glycon has its own workspace, 14 rules live and company laptops connected; the setup checklist on the Start page now reads 4 of 8 done.",workspace:"fresh",start:"onboarding/admin",poster:9,steps:[{target:{selector:"button.choice",text:"Continue with Okta"},action:"click",title:"Day one: sign in with Okta",body:"Nothing at Glycon is governed yet. Priya, the admin, opens setup and signs in with Okta, the company login, so every agent action traces to a person.",say:"Okay, it's day one at Glycon and nothing is governed yet. Priya, the admin, signs in with Okta, the company login, so every agent action traces back to a person.",waitFor:{selector:"div.row",text:"Signed in as"}},{target:{selector:".step-footer .next",text:"Create workspace"},action:"click",title:"Create the workspace",body:"Wrapbox creates Glycon's workspace in the US region, with its own digital seal (a signing key) and a decision log that can't be quietly altered.",say:"Next, Wrapbox creates Glycon's own workspace in the U-S region. It gets its own digital seal, a signing key, and a decision log nobody can quietly change.",waitFor:"div:has(> .tick:nth-child(4) > .ok)"},{target:{selector:".step-footer .next",text:"Continue"},action:"click",title:"Next: which agents to govern",body:"Wrapbox can scan GitHub to find agents already in use. It reads only their small settings files, never source code.",say:"So, which agents should Wrapbox govern? It can scan GitHub to find agents already in use, and it only reads their small settings files, never the source code.",waitFor:{selector:"div:has(> div.row > button.btn-primary)",text:"Connect GitHub"}},{target:{selector:"button.choice",text:"Coding agents"},action:"click",title:"Start with coding agents",body:"Priya skips the scan and ticks coding agents, like Claude Code and Codex. They can read, change and run code on a laptop, so they come first.",say:"Priya skips the scan and ticks coding agents, like Claude Code and Codex. They can read, change and run code right on a laptop, so they come first.",waitFor:{selector:"button.choice.selected",text:"Coding agents"}},{target:{selector:".step-footer .next",text:"Continue"},action:"click",title:"Next: the company's rules",body:"Wrapbox calls the company's rules an intent contract. Priya can start from a recommended set, or write each rule in plain English.",say:"Now for the company's rules, which Wrapbox calls an intent contract. Priya can start from a recommended set, or write each rule in plain English.",waitFor:{selector:"div.grid:has(> button.choice)",text:"Start from scratch"}},{target:{selector:"button.choice",text:"Start with recommended protections"},action:"click",title:"Check the recommended baseline",body:"Five ready-made rule sets, each labelled honestly: ENFORCED means Wrapbox can fully apply it, DEGRADED only partly, PENDING not yet.",say:"Priya picks the recommended protections: five ready-made rule sets, each labelled honestly. Enforced means Wrapbox can fully apply it, degraded only partly, and pending not yet.",waitFor:{selector:"div:has(> div.row > span.chip)",text:"rules"}},{target:{selector:"button",text:"Publish contract"},action:"click",title:"Publish: 14 rules go live",body:"Four sets switch on at once: the top bar now reads E Op={id:"siem-export",order:112,persona:{userId:"u-maya",name:"Maya Chen",role:"Security Analyst"},title:"Send decisions to the SIEM",goal:"Maya's SOC works in its SIEM and doesn't want another console — every Wrapbox decision should land where her team already looks.",outcome:"Maya can export exactly the records she's looking at as OCSF or OpenTelemetry, each carrying the complete decision, and knows live streaming to Splunk is the part still simulated.",start:"control",poster:2,steps:[{target:{selector:".rail-item",text:"Evidence"},action:"click",title:"One record per decision",body:"Maya opens Evidence: one complete record per decision, the same records her SOC needs.",say:"Maya's team lives in their SIEM, so she opens Evidence: one complete record per decision, which is exactly what her SOC needs.",waitFor:{selector:".overview-card",text:"Complete decision records"}},{target:{selector:".fselect",text:"Decision"},action:"select",value:"BLOCK",title:"Pick what to send",body:"She narrows the ledger to blocked actions — what her SOC wants first.",say:"She narrows the ledger to blocked actions, which is what her SOC wants first.",waitFor:".fcount"},{target:{selector:"div",text:"Export the records shown"},title:"Two standard formats",body:"Export sends exactly the records shown. OCSF 1.3.0 files each one by where it happened — file, process, HTTP or API activity. OTLP sends them as OpenTelemetry logs.",say:"Export sends exactly the records shown. O-C-S-F files each one by where it happened, as file, process, H-T-T-P or A-P-I activity, and O-T-L-P sends them as Open Telemetry logs.",pad:10},{target:{selector:".ecard",nth:0},action:"click",title:"What each record carries",body:"Every exported record carries the whole decision: who, which agent, the action, the data, the destination, the rule and reason, any approver, and the outcome.",say:"And every exported record carries the whole decision: who, which agent, the action, the data, where it was going, the rule and reason n code, and run tests. Pushing to main or touching production never happens on its own.",say:"Claude Code, the team's coding agent, may edit code on feature branches, kept apart from the main code, and run tests. But pushing to main or touching production never happens alone."},{target:{within:".ecard",selector:"dd",text:"Used 2 times"},title:"What revoking would change",body:"Wrapbox re-checks Claude Code's 2 recorded actions without this permission. A feature-branch push would go from running alone (ALLOW) to waiting for a person (REVIEW).",say:"Here's the cool part: Wrapbox re-checks Claude Code's two recorded actions without this permission. A feature-branch push would go from running alone to waiting for a person.",pad:10},{target:{selector:"button",text:"Revoke",exact:!0},action:"click",title:"Revoke, with the impact in view",body:"Alex clicks Revoke. Nothing changes yet: the card asks to confirm, with that impact still in view.",say:"Okay, Alex clicks Revoke, but nothing changes yet. The card first asks to confirm, with that impact still right there in view.",waitFor:{selector:".ecard-body",text:"Revoke Claude Code's everyday permission"}},{target:{selector:"button",text:"Yes, revoke"},action:"click",title:"Confirm, and it takes effect",body:"Alex confirms, and it applies at once. Claude Code's card leaves the Active list, and the counts at the top update.",say:"Alex confirms, and it applies straight away. Claude Code's card leaves the Active list, and the counts at the top update.",waitFor:".metricband",placement:"bottom"},{target:{selector:".metric",text:"Revoked / expired"},title:"What “needs a yes again” means",body:"Until someone grants it again, none of Claude Code's everyday work on checkout-service runs on its own. What used to run freely now waits for a person's approval.",say:"Until someone grants it again, none of Claude Code's everyday work on checkout service runs alone. What used to run freely now waits for a person's okay.",pad:6},{target:{sele
