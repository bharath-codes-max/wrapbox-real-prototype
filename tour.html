<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wrapbox — live walkthrough</title>
    <script>
      // Walkthrough sandbox: the real Wrapbox app on in-memory storage, so every
      // walkthrough starts from the seeded company and never reads or changes
      // anything a visitor saved in the real app. Always the light theme.
      (function () {
        function mem() {
          var m = Object.create(null);
          return {
            getItem: function (k) { return k in m ? m[k] : null; },
            setItem: function (k, v) { m[k] = String(v); },
            removeItem: function (k) { delete m[k]; },
            clear: function () { m = Object.create(null); },
            key: function (i) { return Object.keys(m)[i] || null; },
            get length() { return Object.keys(m).length; }
          };
        }
        var local = mem(), session = mem();
        local.setItem("wrapbox-theme", "light");
        local.setItem("wrapbox-real-prototype-workspace", "demo");
        try {
          Object.defineProperty(window, "localStorage", { configurable: true, get: function () { return local; } });
          Object.defineProperty(window, "sessionStorage", { configurable: true, get: function () { return session; } });
        } catch (e) {}
        document.documentElement.dataset.theme = "light";
        var q = new URLSearchParams(location.search);
        if (q.has("shot") || q.has("check")) document.documentElement.dataset.tourStill = "1";
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <div id="tour"></div>
    <script type="module" src="/src/tour/main.tsx"></script>
  </body>
</html>
