<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wrapbox</title>
    <script>
      // Dark is the default; apply a saved light choice before first paint.
      try {
        // ?theme=light|dark sets the saved choice (used by the portfolio screenshot capture).
        var q = new URLSearchParams(location.search).get("theme");
        if (q === "light") localStorage.setItem("wrapbox-theme", "light");
        if (q === "dark") localStorage.removeItem("wrapbox-theme");
        if (localStorage.getItem("wrapbox-theme") === "light") document.documentElement.dataset.theme = "light";
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
