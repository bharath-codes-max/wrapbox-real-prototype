<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wrapbox — Product Portfolio v2</title>
    <meta name="description" content="Wrapbox: runtime authorization for AI agents — a product portfolio from problem space to working product." />
    <script>
      // Light is the deck default; a saved dark choice is applied before first paint.
      try {
        var q = new URLSearchParams(location.search).get("theme");
        // v2/v3 always open in the light theme; ?theme=dark opens dark. The toggle still works per visit.
        if (new URLSearchParams(location.search).has("shot")) document.documentElement.dataset.shot = "1"; // capture mode: no canvas transition
        document.documentElement.dataset.theme = q === "dark" ? "dark" : "light"; document.documentElement.dataset.deck = "v2";
      } catch (e) { document.documentElement.dataset.theme = "light"; }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="deck"></div>
    <script type="module" src="/src/portfolio/main-v2.tsx"></script>
  </body>
</html>
